# FlashRouter configuration is optional.
#
# Everything you normally need (providers, accounts, combos, API keys) is
# configured from the dashboard and stored in SQLite. Copy this file to
# config.toml only if you want to change the bind address or defaults.

[server]
host = "127.0.0.1"
port = 20128
log_level = "info"

[gateway]
# Compress large tool outputs before sending them upstream.
token_saver = true
# Extra retries per upstream target on transient failures.
max_retries = 2
connect_timeout = 10.0
request_timeout = 300.0

[admin]
# Optional: require this token in the X-Admin-Token header for /admin/api.
# Leave empty for a localhost-only dashboard.
token = ""
