[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashrouter"
version = "0.1.0"
description = "A lightweight, local-first OpenAI-compatible gateway"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "openai>=1.40",
    "pytest>=8.0",
    "anyio>=4.0",
    "ruff>=0.6",
]

[project.scripts]
flashrouter = "flashrouter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["openrouter_proxy.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
